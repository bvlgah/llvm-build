default:
  image: python:3.12
  before_script:
    - python3 -m venv ${PYTHON_VENV_DIR}
    - . ${PYTHON_VENV_DIR}/bin/activate
    - pip install -q uv
    - uv pip install -q --group all -r pyproject.toml

variables:
  # Cache directory for ccache.
  CCACHE_DIR: /opt/cache/ccache
  # URL, branch, and persistent local directory for llvm repo.
  LLVM_REPO_URL: https://gitlab.com/compiler2462701/llvm.git
  LLVM_REPO_BRANCH: inst-sched
  LLVM_SOURCE_DIR: ${CI_BUILDS_DIR}/${CI_PROJECT_NAMESPACE_SLUG}/llvm-project
  LLVM_BUILD_DIR: /opt/build/llvm
  # Python-related variables
  PYTHON_VENV_DIR: /opt/venv/llvm-build

stages:
  - build
  - test

code-checking:
  stage: build
  script:
    - pre-commit install --install-hooks
    - pre-commit run --all-files

run-unit-test:
  stage: test
  script:
    - uv pip install .
    - pytest tests/unittest

build-and-test-llvm:
  stage: test
  tags:
    - "linux"
    - "docker"
  parallel:
    matrix:
      - IMAGE_VERSION: ["24.04", "26.04"]
  image: ubuntu:${IMAGE_VERSION}
  rules:
    # Enable building and testing of LLVM only if a MR against the default
    # branch is triggered, or a commit is pushed to the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
  before_script:
    # Install building depedencies.
    - ./scripts/ubuntu/install_build.sh
    - !reference [default, before_script]
  script:
    # Fetch LLVM code
    - |
      if [ ! -d ${LLVM_SOURCE_DIR} ]; then
        git clone --depth 1 --branch ${LLVM_REPO_BRANCH} ${LLVM_REPO_URL} ${LLVM_SOURCE_DIR}
      else
        cd ${LLVM_SOURCE_DIR}
        git checkout ${LLVM_REPO_BRANCH}
        git pull origin ${LLVM_REPO_BRANCH}
      fi
    # Go back to the project root directory.
    - cd ${CI_PROJECT_DIR}
    - uv pip install .
    # `psutil` is required by `llvm-lit` to set timeouts.
    - uv pip install psutil
    - ccache --zero-stats
    - >
      llvm-build \
        --no-install \
        --config config/inst-sched/llvm-release.yaml \
        --src-dir ${LLVM_SOURCE_DIR}/llvm \
        --build-dir ${LLVM_BUILD_DIR}
    # Run unit test cases `UnitTests` and lit test cases `check`.
    - ninja -C ${LLVM_BUILD_DIR} UnitTests check
    - ccache --show-stats
